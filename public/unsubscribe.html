<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>הסרה מרשימת הדיוור | MyPlatform</title>

    <!-- Bootstrap RTL -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Heebo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #faf7f9;

            font-family: 'Assistant', 'Heebo', sans-serif;
        }

        .unsubscribe-card {

            width: 100%;
            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .icon {

            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #fce4ec;

            color: #d81b60;

            font-size: 28px;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 12px;
        }

        .description {

            color: #6c757d;

            line-height: 1.7;

            margin-bottom: 30px;
        }

        .form-control {

            padding: 12px;

            border-radius: 10px;
        }

        .btn-remove {

            background: #d81b60;

            border: none;

            color: white;

            padding: 12px;

            border-radius: 10px;

            font-weight: 600;

            transition: 0.2s;
        }

        .btn-remove:hover {

            background: #ad1457;

            color: white;
        }

        #message {

            margin-top: 20px;

            font-weight: 500;
        }

        .back-link {

            display: inline-block;

            margin-top: 25px;

            color: #6c757d;

            text-decoration: none;
        }

        .back-link:hover {
            color: #d81b60;
        }

    </style>

</head>


<body>


    <div class="container px-3">

        <div class="unsubscribe-card">

            <!-- Icon -->

            <div class="icon">

                <i class="bi bi-envelope-x"></i>

            </div>


            <!-- Title -->

            <h1>
                הסרה מרשימת הדיוור
            </h1>


            <!-- Description -->

            <p class="description">

                אם אינך מעוניינת לקבל מאיתנו הודעות,
                ניתן להסיר את כתובת האימייל שלך
                מרשימת הדיוור.

            </p>


            <!-- Form -->

            <form id="unsubscribeForm">

                <div class="mb-3 text-end">

                    <label
                        for="email"
                        class="form-label fw-semibold">

                        כתובת אימייל

                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="example@email.com"
                        dir="ltr"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-remove w-100">

                    הסר אותי מרשימת הדיוור

                </button>

            </form>


            <!-- Server message -->

            <div id="message"></div>


            <!-- Back -->

            <a
                href="/"
                class="back-link">

                <i class="bi bi-arrow-right"></i>

                חזרה לאתר

            </a>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="./js/unsubscribe.js"></script>

</body>

</html>
